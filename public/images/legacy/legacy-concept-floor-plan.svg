    <path d="M40 0V1000M80 0V1000M120 0V1000M160 0V1000M200 0V1000M240 0V1000M280 0V1000M320 0V1000M360 0V1000M400 0V1000M440 0V1000M480 0V1000M520 0V1000M560 0V1000M600 0V1000M640 0V1000M680 0V1000M720 0V1000M760 0V1000M800 0V1000M840 0V1000M880 0V1000M920 0V1000M960 0V1000M1000 0V1000M1040 0V1000M1080 0V1000M1120 0V1000M1160 0V1000M1200 0V1000M1240 0V1000M1280 0V1000M1320 0V1000M1360 0V1000M1400 0V1000M1440 0V1000M1480 0V1000M1520 0V1000M1560 0V1000"/>
