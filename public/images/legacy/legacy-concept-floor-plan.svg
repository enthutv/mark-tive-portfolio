      <rect x="430" y="215" width="250" height="140" fill="#12395f" stroke="#8de3ff" stroke-width="3"/>
      <rect x="0" y="355" width="680" height="100" fill="#0a203a" stroke="#8de3ff" stroke-width="3"/>
