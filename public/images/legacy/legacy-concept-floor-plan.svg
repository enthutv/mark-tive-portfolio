      <text x="340" y="495" fill="#82d8ff" font-size="15" text-anchor="middle">BALCONY FACING BURGOS STREET</text>
    </g>

    <!-- Dimensions and notes -->
    <g fill="#b8d9ea" font-size="14">
      <text x="70" y="780">ASSUMED GROSS FLOOR AREA</text><text x="70" y="810" fill="#ffffff" font-size="27" font-weight="700">432 m²</text>
      <text x="330" y="780">ESTIMATE BASIS</text><text x="330" y="810" fill="#ffffff" font-size="20" font-weight="700">2 × 216 m² floor plates</text>
      <text x="730" y="780">CONCEPT INTENT</text><text x="730" y="810" fill="#ffffff" font-size="20" font-weight="700">4 rental bays + flexible upper floor</text>
    </g>
    <line x1="70" y1="850" x2="1530" y2="850" stroke="#c9a65b" stroke-width="2"/>
    <text x="70" y="892" fill="#ffffff" font-size="16" font-weight="700">IMPORTANT ASSUMPTION</text>
    <text x="70" y="925" fill="#b8d9ea" font-size="15">Prepared from photographs and stated project data only. Dimensions, areas and room arrangements are illustrative estimating assumptions.</text>
    <text x="70" y="954" fill="#b8d9ea" font-size="15">A measured survey and signed architectural/engineering drawings are required before construction, permitting or procurement.</text>
    <text x="1510" y="955" text-anchor="end" fill="#c9a65b" font-size="15" font-weight="700">REV. P01 · 25 SEP 2026</text>
