      <rect x="0" y="320" width="680" height="75" fill="#0a203a" stroke="#8de3ff" stroke-width="3"/>
      <rect x="250" y="320" width="180" height="135" fill="#12395f" stroke="#8de3ff" stroke-width="3"/>
      <rect x="0" y="395" width="250" height="60" fill="#0a203a" stroke="#8de3ff" stroke-width="3"/>
      <rect x="430" y="395" width="250" height="60" fill="#0a203a" stroke="#8de3ff" stroke-width="3"/>
      <g fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">
        <text x="85" y="145">COMMERCIAL</text><text x="85" y="170">UNIT 01</text><text x="85" y="205" fill="#82d8ff" font-size="14">54 m²</text>
        <text x="255" y="145">COMMERCIAL</text><text x="255" y="170">UNIT 02</text><text x="255" y="205" fill="#82d8ff" font-size="14">54 m²</text>
        <text x="425" y="145">COMMERCIAL</text><text x="425" y="170">UNIT 03</text><text x="425" y="205" fill="#82d8ff" font-size="14">54 m²</text>
        <text x="595" y="145">COMMERCIAL</text><text x="595" y="170">UNIT 04</text><text x="595" y="205" fill="#82d8ff" font-size="14">54 m²</text>
